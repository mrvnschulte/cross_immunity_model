[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cross_immunity_model"
version = "0.1.0"
description = "Generic multi-variant model for infectious diseases with partial cross-immunity"
readme = "README.md"

authors = [
    {name = "Marvin Schulte", email = "marvin.schulte@itwm.fraunhofer.de"}
]

requires-python = ">=3.9"

dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "sympy>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["cross_immunity_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=cross_immunity_model --cov-report=term-missing"