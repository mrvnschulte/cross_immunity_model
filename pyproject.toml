[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Cross Immunity Model"
version = "0.1.0"

description = "Generic multi-variant model for infectious diseases with partial cross-immunity"
readme = "README.md"
license = {text = ""}

authors = [
    {name = "Marvin Schulte",
    email = "marvin.schulte@itwm.fraunhofer.de"}
]

urls = {
    Homepage = "",                           # Projekt-Website
    Repository = "",                         # Git-URL
    Documentation = "",                      # Dokumentations-URL
    "Issue Tracker" = "",                    # Bug-Tracker
}

classifiers = [
    # "Development Status :: 1 - Planning",
    # "Development Status :: 2 - Pre-Alpha",
    # "Development Status :: 3 - Alpha",
    # "Development Status :: 4 - Beta",
    # "Development Status :: 5 - Production/Stable",

    # "Intended Audience :: Science/Research",
    # "License :: OSI Approved :: MIT License",

    # "Programming Language :: Python :: 3",
    # "Programming Language :: Python :: 3.8",
    # "Programming Language :: Python :: 3.9",
    # "Programming Language :: Python :: 3.10",
    # "Programming Language :: Python :: 3.11",
    # "Programming Language :: Python :: 3.12",

    # "Operating System :: OS Independent",

    # "Topic :: Scientific/Engineering :: Bio-Informatics",
]

requires-python = ">=3.9"

dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "sympy>=1.9.0",
]

[project.optional-dependencies]
# dev = ["pytest>=7.0", "black", "ruff"]     # Entwicklung
# docs = ["sphinx", "myst-parser"]           # Dokumentation
# test = ["pytest-cov", "pytest-mock"]       # Tests

[tool.setuptools.packages.find]
include = ["cross_immunity_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
