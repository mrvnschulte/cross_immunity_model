name: Build and deploy documentation

on:
  push:
    branches:
      - master
    paths:
      - "cross_immunity_model/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Generate API pages from docstrings
        run: |
          rm -rf docs/source/api
          python -m sphinx.ext.apidoc \
            --force \
            --separate \
            --module-first \
            --output-dir docs/source/api \
            cross_immunity_model \
            cross_immunity_model/__pycache__ \
            cross_immunity_model/internal \
            .git

      - name: Build HTML documentation
        run: |
          python -m sphinx -b html --keep-going \
            docs/source \
            docs/build/html

      - name: Create GitHub Pages configuration
        run: touch docs/build/html/.nojekyll

      - name: Upload documentation as Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish on GitHub
        id: deployment
        uses: actions/deploy-pages@v4