# .gitlab-ci.yml

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.12
  before_script:
    - pip install -e ".[dev]"
  script:
    - pytest tests/ -v --tb=short
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week